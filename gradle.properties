org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Controls whether the real Meta DAT SDK is linked. Default is false so a fresh
# clone builds against the mock glasses backend with no hardware.
# Real-hardware builds opt in with -Pgemglasses.useRealGlasses=true (the SDK comes
# from Maven Central; no credentials needed to build — see README > Setup).
gemglasses.useRealGlasses=false
